# v4 纯 DL 管线配置（PLAN.md §9.2 提交包需要；训练/推理都从这里读"意图"，实现仍在代码里）
schema_version: 1
pipeline: v4
features:
  version: F1                 # F1(32) / F1+phys / F1+win / F1+well / F2(368)
  groups: [basic]             # E2 的分组名（与 src/features/groups.py 注册表一致）
model:
  arch: RowMLP                # RowMLP（E1/E6）/ UNet1D、TCN（E3）/ PatchTF（E4）
  hidden: 256
  layers: 2
  dropout: 0.1
training:
  protocol: two_phase         # 内折选 epoch/τ → 全折重训（H1：禁止用 outer 折选择）
  epochs: 30
  lr: 2.0e-3
  weight_decay: 1.0e-4
  batch_size: 4096
  seed: 42
  amp_dtype: bf16             # NPU 上 bf16；CPU 自动禁用
atomic:
  two_stage: true             # E6/P0：阶段 1 原子+联合头，阶段 2 冻结原子头训连续头
  q_head_lr_mult: 0.0
  slice_weights: {joint: 0.2, nonjoint_atom: 0.2, valid: 1.0}
  tau:
    grid: {lo: 0.05, hi: 0.95, step: 0.01}
    rule: longest_plateau_midpoint
    source: inner_oof_only
decode:
  missing_mode: drop          # 官方分母口径（逐目标排除缺测）
  sw: {clip: [0.0, 100.0]}    # SW 单一百分数尺度，绝不 [0,1]
submission:
  expected_wells: 10
  expected_rows: 95948
  cpu_only: true
